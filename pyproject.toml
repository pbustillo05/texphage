[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texphage"
version = "0.1.0"
description = "Unfold multi-file LaTeX projects and expand user-defined macros"
requires-python = ">=3.10"
dependencies = [
    "regex>=2022.1.18",
    "filelock>=3.12",
]

[project.optional-dependencies]
agents = [
    "pdf2image>=1.16",
    "pdfplumber>=0.9",
    "scikit-image>=0.21",
    "numpy>=1.24",
    "tqdm>=4.65",
    "requests>=2.31",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# _regex.py / demacro.py: lambda pattern-builders and % formatting are
# intentional — regex patterns contain { } which would require double-escaping
# in f-strings, making them unreadable and error-prone. DANGER ZONE: do not
# convert these lambdas or format strings. F507 false-positives: ruff
# mis-counts %s substitutions in helpers that expand to multi-placeholder strings.
"src/texphage/_regex.py" = ["E501", "E731", "UP031"]
"src/texphage/demacro.py" = ["E501", "E731", "UP031", "F507"]
# find_packages.py: % formatting in regex pattern construction (same reason).
"src/texphage/find_packages.py" = ["E501", "UP031"]
# unfold.py: long regex pattern lines that cannot be meaningfully shortened.
"src/texphage/unfold.py" = ["E501"]

[[tool.mypy.overrides]]
# All no-any-return and no-untyped-def warnings in these files come from the
# untyped `regex` package (no stubs available). The logic is correct.
module = [
    "texphage.demacro",
    "texphage.find_packages",
    "texphage.unfold",
    "texphage._regex",
]
warn_return_any = false
disallow_untyped_defs = false
ignore_errors = false

[[tool.mypy.overrides]]
# regex has no type stubs; suppress import-untyped globally for it.
module = "regex"
ignore_missing_imports = true

[tool.mypy]
python_version = "3.10"
strict = false
# warn_unused_imports not in all mypy versions; use --warn-unused-imports flag instead
# warn_unused_imports = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texphage"
version = "0.1.0"
description = "Unfold multi-file LaTeX projects and expand user-defined macros"
requires-python = ">=3.10"
dependencies = [
    "regex>=2022.1.18",
    "filelock>=3.12",
]

[project.optional-dependencies]
agents = [
    "pdf2image>=1.16",
    "pdfplumber>=0.9",
    "scikit-image>=0.21",
    "numpy>=1.24",
    "tqdm>=4.65",
    "requests>=2.31",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_imports = true
warn_return_any = true
disallow_untyped_defs = true
